name: CI

on:
  push:
    branches:
      - main
      - 'FEAT/webphone-expansion'
  pull_request:

jobs:
  turn-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: TURN and media helper contracts
        run: python3 -m unittest discover -s docker/healthcheck -p 'test_*.py'

      - name: Protected seat snapshot contract
        run: python3 -m unittest discover -s docker/seat -p 'test_*.py'

  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Package dry run
        run: npm pack --dry-run

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --pull -t webrtc-sip-gateway:ci ./docker

      - name: TURN contract through isolated Kamailio
        # Test packaged files. Runtime initialization validates the rendered
        # Kamailio config with its actual environment before starting services.
        run: python3 docker/healthcheck/smoke_turn_runtime.py --image webrtc-sip-gateway:ci

      - name: Contact-less REGISTER query preserves bindings
        run: python3 docker/healthcheck/smoke_register_query.py --image webrtc-sip-gateway:ci

      - name: Kamailio UAC plaintext and HA1 authentication
        run: python3 docker/healthcheck/smoke_uac_auth.py --image webrtc-sip-gateway:ci

      - name: Local seats and shared upstream authenticated calls
        run: python3 docker/healthcheck/smoke_seat_routing.py --image webrtc-sip-gateway:ci

      - name: Seat call cancellation and upstream failure handling
        run: python3 docker/healthcheck/seat_dialog_fixture.py --image webrtc-sip-gateway:ci

      - name: Caller identity stays fixed across existing call dialogs
        run: python3 docker/healthcheck/seat_dialog_fixture.py --image webrtc-sip-gateway:ci --caller-id

      - name: Legacy registration with local seats and no control backend
        run: python3 docker/healthcheck/smoke_register_query.py --image webrtc-sip-gateway:ci --seat-mode

      - name: Managed seat provisioning, revocation and rotation
        run: python3 docker/healthcheck/smoke_seat_routing.py --image webrtc-sip-gateway:ci --managed

      - name: Durable per-agent call events and terminal outcomes
        run: python3 docker/healthcheck/smoke_seat_routing.py --image webrtc-sip-gateway:ci --managed --call-events --presence

      - name: Recording negotiation hooks and disabled compatibility
        run: python3 docker/healthcheck/smoke_recording_media_hooks.py --image webrtc-sip-gateway:ci

      - name: Browser DTLS role stays passive from offer through answer
        run: python3 docker/healthcheck/smoke_dtls_role.py --image webrtc-sip-gateway:ci

      - name: Media recording and subscription capabilities
        run: |
          docker build --build-arg GATEWAY_IMAGE=webrtc-sip-gateway:ci \
            -t webrtc-sip-gateway:media-proof \
            -f docker/healthcheck/media/Dockerfile docker/healthcheck/media
          python3 docker/healthcheck/smoke_media_capabilities.py \
            --image webrtc-sip-gateway:media-proof

      - name: Native subscription source-leg mapping
        run: python3 docker/healthcheck/smoke_recording_mapping.py --image webrtc-sip-gateway:media-proof

      - name: Native subscription recorder lifecycle
        run: python3 docker/healthcheck/smoke_native_recording.py --image webrtc-sip-gateway:media-proof

      - name: Native subscription capture capacity
        run: python3 docker/healthcheck/smoke_recording_capacity.py --image webrtc-sip-gateway:media-proof

      - name: Generate temporary TLS cert for runtime tests
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.ci-ssl"
          openssl req -x509 -newkey rsa:2048 -sha256 -days 1 -nodes \
            -subj "/CN=gw.example.com" \
            -keyout "$GITHUB_WORKSPACE/.ci-ssl/key.pem" \
            -out "$GITHUB_WORKSPACE/.ci-ssl/cert.pem"

      - name: Runtime smoke (read-only + tmpfs /run exec)
        run: |
          docker run -d --name gwsmoke \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev \
            --tmpfs /run:rw,exec,nosuid,nodev \
            -e DOMAIN=gw.example.com \
            -e TURN_SECRET=test-secret \
            -e TURN_TTL=3600 \
            -e ALLOWED_SIP_DOMAINS= \
            -v "$GITHUB_WORKSPACE/.ci-ssl/cert.pem:/etc/ssl/cert.pem:ro" \
            -v "$GITHUB_WORKSPACE/.ci-ssl/key.pem:/etc/ssl/key.pem:ro" \
            -p 18082:80 \
            -p 18443:443 \
            -p 15060:5060/tcp \
            -p 15060:5060/udp \
            webrtc-sip-gateway:ci
          ready=0
          for _ in $(seq 1 60); do
            if docker exec gwsmoke sh -ec 'rtpengine-ctl -ip 127.0.0.1 -port 7722 list numsessions >/dev/null && ss -lnt | grep -qE ":443[[:space:]]"' >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          [ "$ready" -eq 1 ]

      - name: Verify runtime smoke process + listeners
        run: |
          if ! docker exec gwsmoke sh -ec 'comm="$(cat /proc/1/comm)"; case "$comm" in init|s6-svscan|s6-linux-init|s6-linux-init-shim) exit 0 ;; *) exit 1 ;; esac'; then
            docker logs gwsmoke || true
            exit 1
          fi

          if ! docker exec gwsmoke sh -ec 'cmd="$(pgrep -a -x rtpengine)"; echo "$cmd"; [ -n "$cmd" ] && echo "$cmd" | grep -Eq -- "--interface=[0-9.]+![0-9.]+" && ! echo "$cmd" | grep -Eq -- "--interface=[^ ]*:"'; then
            docker logs gwsmoke || true
            exit 1
          fi

          if ! docker exec gwsmoke sh -ec 'for port in 80 443 5060; do ss -lnt | grep -qE ":${port}[[:space:]]"; done; ss -lnu | grep -qE ":5060[[:space:]]"'; then
            docker logs gwsmoke || true
            exit 1
          fi

      - name: Boot container
        run: |
          docker run -d --name webrtc-sip-gateway-ci \
            -e DOMAIN=gw.example.com \
            -e TURN_SECRET=test-secret \
            -e TURN_TTL=3600 \
            -e ALLOWED_SIP_DOMAINS= \
            -v "$GITHUB_WORKSPACE/.ci-ssl/cert.pem:/etc/ssl/cert.pem:ro" \
            -v "$GITHUB_WORKSPACE/.ci-ssl/key.pem:/etc/ssl/key.pem:ro" \
            -p 18080:80 \
            webrtc-sip-gateway:ci

      - name: Verify dev mode boot (ALLOWED_SIP_DOMAINS empty)
        run: |
          status=""
          for _ in $(seq 1 30); do
            status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' webrtc-sip-gateway-ci)"
            [ "$status" = "healthy" ] && break
            sleep 1
          done
          [ "$status" = "healthy" ]

      - name: Verify healthcheck endpoint
        run: curl -fsS http://127.0.0.1:18080/.well-known/acme-challenge/healthcheck

      - name: Verify ACME miss redirects to HTTPS domain
        run: |
          curl -sSI http://127.0.0.1:18080/.well-known/acme-challenge/missing \
            | grep -qi '^Location: https://gw.example.com/.well-known/acme-challenge/missing'

      - name: Verify turn-credentials endpoint on localhost port 8880
        run: |
          docker exec webrtc-sip-gateway-ci curl -fsS http://127.0.0.1:8880/turn-credentials \
            | grep -q '"username"'
          docker exec webrtc-sip-gateway-ci curl -fsS http://127.0.0.1:8880/turn-credentials \
            | grep -q '"credential"'
          docker exec webrtc-sip-gateway-ci curl -fsS http://127.0.0.1:8880/turn-credentials \
            | grep -q '"uris"'

      - name: Verify turn-credentials is 404 when TURN_SECRET is unset
        run: |
          docker run -d --name webrtc-sip-gateway-ci-no-turn \
            -e DOMAIN=gw.example.com \
            -v "$GITHUB_WORKSPACE/.ci-ssl/cert.pem:/etc/ssl/cert.pem:ro" \
            -v "$GITHUB_WORKSPACE/.ci-ssl/key.pem:/etc/ssl/key.pem:ro" \
            -p 18081:80 \
            webrtc-sip-gateway:ci
          ready=0
          for _ in $(seq 1 30); do
            if docker exec webrtc-sip-gateway-ci-no-turn sh -ec 'code="$(curl -s --connect-timeout 1 --max-time 2 -o /dev/null -w "%{http_code}" http://127.0.0.1:8880/turn-credentials)"; [ "$code" = "404" ]' >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          [ "$ready" -eq 1 ]
          docker rm -f webrtc-sip-gateway-ci-no-turn

      - name: Verify core processes
        run: |
          docker exec webrtc-sip-gateway-ci sh -ec '
          comm="$(cat /proc/1/comm || true)";
          case "$comm" in
            init|s6-svscan|s6-linux-init|s6-linux-init-shim) exit 0 ;;
            *)
              echo "Unexpected PID1 comm: $comm" >&2
              ps -o pid,comm,args -p 1 >&2 || true
              exit 1
              ;;
          esac
          '
          docker exec webrtc-sip-gateway-ci pgrep -f kamailio
          docker exec webrtc-sip-gateway-ci pgrep -f rtpengine
          docker exec webrtc-sip-gateway-ci pgrep -f healthcheck_server.py

      - name: Dump logs on failure
        if: failure()
        run: |
          docker logs gwsmoke || true
          docker logs webrtc-sip-gateway-ci || true

      - name: Cleanup
        if: always()
        run: |
          docker rm -f gwsmoke || true
          docker rm -f webrtc-sip-gateway-ci || true
          docker rm -f webrtc-sip-gateway-ci-no-turn || true
