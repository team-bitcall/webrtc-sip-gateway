# Loaded only by the explicit local-seat startup mode. Legacy installations do
# not load these modules or read the protected snapshot.
loadmodule "auth.so"
loadmodule "htable.so"
loadmodule "uac.so"

modparam("auth", "qop", "auth")
modparam("auth", "nonce_count", 1)
modparam("auth", "nonce_expire", 60)
modparam("auth", "auth_checks_register", 9)
modparam("auth", "auth_checks_no_dlg", 9)
modparam("htable", "htable", "seat_meta=>size=8;autoexpire=600;")
modparam("htable", "htable", "seat_index=>size=12;autoexpire=600;")
modparam("htable", "htable", "seat_users=>size=12;autoexpire=600;")
modparam("htable", "htable", "seat_profiles=>size=10;autoexpire=600;")
modparam("htable", "htable", "seat_calls=>size=12;autoexpire=43200;")
modparam("uac", "auth_realm_avp", "$avp(seat_auth_realm)")
modparam("uac", "auth_username_avp", "$avp(seat_auth_username)")
modparam("uac", "auth_password_avp", "$avp(seat_auth_password)")
modparam("uac", "restore_mode", "auto")
modparam("uac", "restore_dlg", 1)
# The dialog tracks downstream CSeq offsets and corrects replies to the browser.
modparam("dialog", "track_cseq_updates", 1)

#!ifdef WITH_SEAT_CONTROL
# Only the local provisioning helper can reach this owner-only Unix socket.
# Generic JSON-RPC is never made available through xhttp or a network listener.
loadmodule "jsonrpcs.so"
modparam("jsonrpcs", "transport", 4)
modparam("jsonrpcs", "dgram_socket", "/run/kamailio/seat-rpc.sock")
modparam("jsonrpcs", "dgram_mode", 0600)
modparam("jsonrpcs", "dgram_workers", 1)
#!endif

include_file "/run/kamailio/seat-snapshot.cfg"

route[SEAT_GATE] {
    $avp(seat_request) = 0;
    if (has_totag() && is_known_dlg()) {
        if ($dlg_var(seat_id) != $null) {
            $avp(seat_request) = 1;
            return;
        }
    }
    $var(seat_call_key) = $ci + "::" + $ft;
    if (is_method("CANCEL") && $sht(seat_calls=>$var(seat_call_key)) != $null) {
        $avp(seat_request) = 1;
        return;
    }
    if ($var(seat_rd) == $env(SEAT_DOMAIN) || $var(seat_fd) == $env(SEAT_DOMAIN)
            || $var(seat_td) == $env(SEAT_DOMAIN) || $ar == $env(SEAT_DOMAIN)) {
        $avp(seat_request) = 1;
    }
}

route[SEAT_REQUEST] {
    # Non-2xx ACK is transaction-owned and must never receive a SIP response.
    if (is_method("ACK") && t_check_trans()) {
        t_relay();
        exit;
    }
    if (is_method("CANCEL")) {
        $var(seat_call_key) = $ci + "::" + $ft;
        if (!($proto =~ "ws") || $sht(seat_calls=>$var(seat_call_key)) != $conid) {
            sl_send_reply("403", "Invalid Call Context");
            exit;
        }
        if (t_check_trans()) { t_relay(); }
        exit;
    }
    if (has_totag()) {
        route(SEAT_DIALOG);
        exit;
    }
    if (!($proto =~ "ws") || !is_method("REGISTER|INVITE")) {
        sl_send_reply("403", "Seat Request Not Allowed");
        exit;
    }
    if ($var(seat_rd) != $env(SEAT_DOMAIN) || $var(seat_fd) != $env(SEAT_DOMAIN)
            || (is_method("REGISTER") && ($var(seat_td) != $env(SEAT_DOMAIN) || $tU != $fU))) {
        sl_send_reply("403", "Invalid Seat Identity");
        exit;
    }
    # A retransmission must reuse the existing transaction and call identity.
    t_check_trans();
    $avp(seat_user) = $fU;
    route(SEAT_PROFILE);
    $var(seat_key) = $avp(seat_prefix) + $avp(seat_user) + "::ha1";
    if (!pv_auth_check("$env(SEAT_DOMAIN)", "$sht(seat_users=>$var(seat_key))", "1", "1")) {
        auth_challenge("$env(SEAT_DOMAIN)", "1");
        exit;
    }
    consume_credentials();
    if (is_method("REGISTER")) {
        route(SEAT_STRIP_HINTS);
        if (!save("seat_location")) { sl_reply_error(); }
        exit;
    }
    # From stays the authenticated seat identity. Caller ID is a separate,
    # single-value hint which is never forwarded as supplied by the browser.
    if ($hdrc(X-Bitcall-Caller-ID) > 1) {
        sl_send_reply("400", "Invalid Caller ID");
        exit;
    }
    $avp(seat_requested_caller_id) = $hdr(X-Bitcall-Caller-ID);
    if ($avp(seat_requested_caller_id) != $null
            && !($avp(seat_requested_caller_id) =~ "^[+]?[0-9]{1,32}$")) {
        sl_send_reply("400", "Invalid Caller ID");
        exit;
    }
    route(SEAT_CALLER_ID);
    route(SEAT_STRIP_HINTS);
    if ($rU == $null || !($rU =~ "^[+]?[0-9*#]{1,32}$")) {
        sl_send_reply("484", "Invalid Destination");
        exit;
    }
    $var(seat_call_key) = $ci + "::" + $ft;
    sht_lock("seat_calls=>$var(seat_call_key)");
    if ($sht(seat_calls=>$var(seat_call_key)) != $null) {
        sht_unlock("seat_calls=>$var(seat_call_key)");
        sl_send_reply("482", "Call Identity Already In Use");
        exit;
    }
    $sht(seat_calls=>$var(seat_call_key)) = $conid;
    sht_unlock("seat_calls=>$var(seat_call_key)");
    remove_hf("Route");
    if (!record_route() || !dlg_manage()) {
        $sht(seat_calls=>$var(seat_call_key)) = $null;
        sl_send_reply("500", "Call State Unavailable");
        exit;
    }
    $dlg_var(seat_id) = $avp(seat_id);
    $dlg_var(seat_tenant) = $avp(seat_tenant);
    $dlg_var(seat_user) = $avp(seat_user);
    $dlg_var(seat_profile) = $avp(seat_profile);
    $dlg_var(seat_effective_caller_id) = $avp(seat_effective_caller_id);
    # A revocation/rotation changes new authorizations, not an established call.
    # Capture its credentials once so re-INVITEs never mix snapshot generations.
    $dlg_var(seat_auth_realm) = $avp(seat_auth_realm);
    $dlg_var(seat_auth_username) = $avp(seat_auth_username);
    $dlg_var(seat_auth_password) = $avp(seat_auth_password);
    $dlg_var(seat_auth_mode) = $avp(seat_auth_mode);
    $dlg_var(seat_connection) = $conid;
    $dlg_var(seat_call_key) = $var(seat_call_key);
    $var(seat_key) = $avp(seat_prefix) + $avp(seat_profile) + "::request_domain";
    $ru = "sip:" + $rU + "@" + $sht(seat_profiles=>$var(seat_key));
    $var(seat_from_domain) = $sht(seat_profiles=>$var(seat_key));
    $dlg_var(seat_request_domain) = $var(seat_from_domain);
    $var(seat_key) = $avp(seat_prefix) + $avp(seat_profile) + "::from_user";
    $var(seat_from) = "sip:" + $sht(seat_profiles=>$var(seat_key)) + "@" + $var(seat_from_domain);
    if ($avp(seat_effective_caller_id) != $null) {
        $var(seat_from) = "sip:" + $avp(seat_effective_caller_id) + "@" + $var(seat_from_domain);
    }
    if (!uac_replace_from("", "$var(seat_from)")) {
        $sht(seat_calls=>$var(seat_call_key)) = $null;
        sl_send_reply("500", "Upstream Identity Unavailable");
        exit;
    }
    if ($avp(seat_effective_caller_id) != $null) { route(SEAT_ADD_CALLER_IDENTITY); }
    $var(seat_key) = $avp(seat_prefix) + $avp(seat_profile) + "::outbound_proxy";
    $du = $sht(seat_profiles=>$var(seat_key));
    $dlg_var(seat_upstream_uri) = $du;
    $avp(seat_auth_retried) = 0;
    $avp(seat_initial_invite) = 1;
    if (has_body("application/sdp")) { route(NATMANAGE); }
    t_on_reply("SEAT_REPLY");
    t_on_failure("SEAT_UPSTREAM_AUTH");
    if (!t_relay()) {
        $sht(seat_calls=>$dlg_var(seat_call_key)) = $null;
        rtpengine_delete();
        sl_reply_error();
    }
    exit;
}

route[SEAT_PROFILE] {
    $avp(seat_tenant) = $sht(seat_index=>$avp(seat_user));
    if ($avp(seat_tenant) == $null) {
        sl_send_reply("403", "Seat Not Available");
        exit;
    }
    $var(seat_key) = $avp(seat_tenant) + "::active";
    # Read the single atomic pointer exactly once for this authorization.
    $var(seat_generation) = $sht(seat_meta=>$var(seat_key));
    $avp(seat_prefix) = $avp(seat_tenant) + "::" + $var(seat_generation) + "::";
    $var(seat_key) = $avp(seat_prefix) + "valid_until";
    if ($var(seat_generation) == $null || $sht(seat_meta=>$var(seat_key)) == $null
            || $sht(seat_meta=>$var(seat_key)) <= $Ts) {
        sl_send_reply("503", "Seat Authorization Unavailable");
        exit;
    }
    $var(seat_key) = $avp(seat_prefix) + "domain";
    if ($sht(seat_meta=>$var(seat_key)) != $env(SEAT_DOMAIN)) {
        sl_send_reply("503", "Seat Authorization Unavailable");
        exit;
    }
    $var(seat_key) = $avp(seat_prefix) + $avp(seat_user) + "::enabled";
    if ($sht(seat_users=>$var(seat_key)) != 1) {
        sl_send_reply("403", "Seat Not Available");
        exit;
    }
    $var(seat_key) = $avp(seat_prefix) + $avp(seat_user) + "::id";
    $avp(seat_id) = $sht(seat_users=>$var(seat_key));
    $var(seat_key) = $avp(seat_prefix) + $avp(seat_user) + "::tenant";
    if ($avp(seat_tenant) != $sht(seat_users=>$var(seat_key))) {
        sl_send_reply("403", "Invalid Seat Profile");
        exit;
    }
    $var(seat_key) = $avp(seat_prefix) + $avp(seat_user) + "::profile";
    $avp(seat_profile) = $sht(seat_users=>$var(seat_key));
    $var(seat_key) = $avp(seat_prefix) + $avp(seat_profile) + "::enabled";
    if ($sht(seat_profiles=>$var(seat_key)) != 1) {
        sl_send_reply("403", "Upstream Not Available");
        exit;
    }
    $var(seat_key) = $avp(seat_prefix) + $avp(seat_profile) + "::tenant";
    if ($sht(seat_profiles=>$var(seat_key)) != $avp(seat_tenant)) {
        sl_send_reply("403", "Invalid Seat Profile");
        exit;
    }
    $var(seat_key) = $avp(seat_prefix) + $avp(seat_profile) + "::realm";
    $avp(seat_auth_realm) = $sht(seat_profiles=>$var(seat_key));
    $var(seat_key) = $avp(seat_prefix) + $avp(seat_profile) + "::username";
    $avp(seat_auth_username) = $sht(seat_profiles=>$var(seat_key));
    $var(seat_key) = $avp(seat_prefix) + $avp(seat_profile) + "::credential";
    $avp(seat_auth_password) = $sht(seat_profiles=>$var(seat_key));
    $var(seat_key) = $avp(seat_prefix) + $avp(seat_profile) + "::credential_kind";
    $avp(seat_auth_mode) = 0;
    if ($sht(seat_profiles=>$var(seat_key)) == "ha1") { $avp(seat_auth_mode) = 1; }
}

route[SEAT_CALLER_ID] {
    $var(seat_key) = $avp(seat_prefix) + $avp(seat_user) + "::caller_id_mode";
    $avp(seat_caller_id_mode) = $sht(seat_users=>$var(seat_key));
    # Policy absence is task 08 compatibility: retain profile fromUser.
    if ($avp(seat_caller_id_mode) == $null) { return; }
    $var(seat_key) = $avp(seat_prefix) + $avp(seat_user) + "::caller_id_default";
    $avp(seat_caller_id_default) = $sht(seat_users=>$var(seat_key));
    if ($avp(seat_caller_id_mode) == "assigned") {
        if ($avp(seat_requested_caller_id) != $null) {
            $var(seat_key) = $avp(seat_prefix) + $avp(seat_user) + "::caller_id_allowed::" + $avp(seat_requested_caller_id);
            if ($sht(seat_users=>$var(seat_key)) != 1) {
                sl_send_reply("403", "Caller ID Not Assigned");
                exit;
            }
            $avp(seat_effective_caller_id) = $avp(seat_requested_caller_id);
            return;
        }
        if ($avp(seat_caller_id_default) == $null || $avp(seat_caller_id_default) == "") {
            sl_send_reply("403", "Caller ID Not Assigned");
            exit;
        }
        $avp(seat_effective_caller_id) = $avp(seat_caller_id_default);
        return;
    }
    if ($avp(seat_caller_id_mode) == "flexible") {
        if ($avp(seat_requested_caller_id) != $null) {
            $avp(seat_effective_caller_id) = $avp(seat_requested_caller_id);
            return;
        }
        if ($avp(seat_caller_id_default) == $null || $avp(seat_caller_id_default) == "") {
            sl_send_reply("400", "Caller ID Required");
            exit;
        }
        $avp(seat_effective_caller_id) = $avp(seat_caller_id_default);
        return;
    }
    sl_send_reply("503", "Caller ID Policy Unavailable");
    exit;
}

route[SEAT_ADD_CALLER_IDENTITY] {
    append_hf("P-Asserted-Identity: <$var(seat_from)>\r\n");
    append_hf("Remote-Party-ID: <$var(seat_from)>;party=calling;screen=yes;privacy=off\r\n");
}

route[SEAT_STRIP_HINTS] {
    remove_hf("Authorization");
    remove_hf("Proxy-Authorization");
    remove_hf_re("^(X-.*|P-K-.*|P-Asserted-Identity|P-Preferred-Identity|Remote-Party-ID|Identity|Identity-Info|Diversion|History-Info|Referred-By|Privacy|Record-Route)$");
}

route[SEAT_DIALOG] {
    if ($dlg_var(seat_id) == $null || !is_known_dlg()) {
        if (!is_method("ACK")) { sl_send_reply("481", "Unknown Seat Call"); }
        exit;
    }
    if ($proto =~ "ws") {
        if ($dlg_var(seat_connection) != $conid) {
            if (!is_method("ACK")) { sl_send_reply("403", "Invalid Call Context"); }
            exit;
        }
    } else if ($dlg_var(seat_peer_ip) != $si || $dlg_var(seat_peer_port) != $sp
            || $dlg_var(seat_peer_proto) != $proto) {
        if (!is_method("ACK")) { sl_send_reply("403", "Invalid Call Peer"); }
        exit;
    }
    if (!is_method("ACK|BYE|INVITE|UPDATE|INFO")) {
        sl_send_reply("405", "Method Not Allowed");
        exit;
    }
    route(SEAT_STRIP_HINTS);
    if (!loose_route()) {
        if (is_method("ACK") && t_check_trans()) { t_relay(); exit; }
        if (!is_method("ACK")) { sl_send_reply("481", "Seat Route Required"); }
        exit;
    }
    if ($proto =~ "ws") {
        $du = $dlg_var(seat_upstream_uri);
        if (is_method("INVITE")) {
            if ($dlg_var(seat_effective_caller_id) != $null) {
                $var(seat_from) = "sip:" + $dlg_var(seat_effective_caller_id) + "@" + $dlg_var(seat_request_domain);
                # UAC auto/dialog restore already preserves the original From.
                route(SEAT_ADD_CALLER_IDENTITY);
            }
            $avp(seat_auth_realm) = $dlg_var(seat_auth_realm);
            $avp(seat_auth_username) = $dlg_var(seat_auth_username);
            $avp(seat_auth_password) = $dlg_var(seat_auth_password);
            # Dialog variables are strings; UAC mode requires an integer.
            $avp(seat_auth_mode) = $(dlg_var(seat_auth_mode){s.int});
            $avp(seat_auth_retried) = 0;
            $avp(seat_initial_invite) = 0;
            t_on_failure("SEAT_UPSTREAM_AUTH");
        }
    } else if ($ru =~ ";alias=") {
        if (!handle_ruri_alias()) { sl_send_reply("400", "Invalid Seat Contact"); exit; }
    }
    if (is_method("BYE")) { rtpengine_delete(); }
    if (is_method("INVITE|UPDATE")) {
        if (has_body("application/sdp")) { route(NATMANAGE); }
        t_on_reply("SEAT_REPLY");
    }
    route(RELAY);
}

onreply_route[SEAT_REPLY] {
    if (!($proto =~ "ws")) {
        $dlg_var(seat_peer_ip) = $si;
        $dlg_var(seat_peer_port) = $sp;
        $dlg_var(seat_peer_proto) = $proto;
    }
    if (nat_uac_test("64")) { add_contact_alias(); }
    if (t_check_status("180|183|200") && has_body("application/sdp")) { route(NATMANAGE); }
}

failure_route[SEAT_UPSTREAM_AUTH] {
    if (t_is_canceled()) { if ($avp(seat_initial_invite) == 1) { rtpengine_delete(); } exit; }
    if (t_check_status("401|407")) {
        $var(seat_authenticated) = 0;
        if ($avp(seat_auth_retried) != 1) {
            if ($avp(seat_auth_mode) == 0) {
                if (uac_auth("0")) { $var(seat_authenticated) = 1; }
            } else if ($avp(seat_auth_mode) == 1) {
                if (uac_auth("1")) { $var(seat_authenticated) = 1; }
            }
        }
        if ($var(seat_authenticated) != 1) {
            if ($avp(seat_initial_invite) == 1) { rtpengine_delete(); }
            t_reply("502", "Upstream Authentication Failed");
            exit;
        }
        $avp(seat_auth_retried) = 1;
        t_on_failure("SEAT_UPSTREAM_AUTH");
        if (!t_relay()) { if ($avp(seat_initial_invite) == 1) { rtpengine_delete(); } t_reply("502", "Upstream Unavailable"); }
        exit;
    }
    if ($avp(seat_initial_invite) == 1) { rtpengine_delete(); }
}

event_route[dialog:end] {
    if ($dlg_var(seat_id) != $null) {
        rtpengine_delete();
        $sht(seat_calls=>$dlg_var(seat_call_key)) = $null;
    }
}

event_route[dialog:failed] {
    if ($dlg_var(seat_id) != $null) {
        rtpengine_delete();
        $sht(seat_calls=>$dlg_var(seat_call_key)) = $null;
    }
}
