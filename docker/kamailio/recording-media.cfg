# Conservative media observation for managed recording only. SDP never leaves Kamailio.
route[RECORDING_MEDIA_BEGIN] {
    $var(recording_observe) = 0;
    if ($env(SEAT_RECORDING_ENABLED) != "1" || $dlg_var(seat_cdr_id) == $null) { return; }
    if (!is_method("INVITE|UPDATE")) { $dlg_var(recording_media_unsafe) = "1"; return; }
    $var(recording_revision) = $(dlg_var(recording_media_revision){s.int}) + 1;
    if ($var(recording_revision) < 1 || $var(recording_revision) > 128) { $dlg_var(recording_media_unsafe) = "1"; return; }
    $dlg_var(recording_media_revision) = (str) $var(recording_revision);
    $var(recording_to_tag) = "";
    if ($tt != $null) { $var(recording_to_tag) = $tt; }
    $var(recording_code) = 0;
    if ($rs != $null) { $var(recording_code) = $rs; }
    $var(recording_json) = "{}";
    jansson_set("string", "callId", "$dlg_var(seat_cdr_id)", "$var(recording_json)");
    jansson_set("integer", "revision", "$var(recording_revision)", "$var(recording_json)");
    jansson_set("string", "method", "$rm", "$var(recording_json)");
    jansson_set("string", "fromTag", "$ft", "$var(recording_json)");
    jansson_set("string", "toTag", "$var(recording_to_tag)", "$var(recording_json)");
    jansson_set("integer", "sipCode", "$var(recording_code)", "$var(recording_json)");
    jansson_set("string", "sdpSha256", "$(rb{s.sha256})", "$var(recording_json)");
    $var(recording_headers) = "Content-Type: application/json\r\nAuthorization: Bearer " + $env(SEAT_CONTROL_TOKEN);
    $var(recording_response) = "";
    $var(recording_status) = http_client_query("http://127.0.0.1:8882/v1/call-events/media/begin", "$var(recording_json)", "$var(recording_headers)", "$var(recording_response)");
    $var(recording_headers) = $null;
    if ($var(recording_status) == 200) { $var(recording_observe) = 1; } else { $dlg_var(recording_media_unsafe) = "1"; }
}

route[RECORDING_MEDIA_COMPLETE] {
    if ($var(recording_observe) != 1) { return; }
    $var(recording_json) = "{}";
    jansson_set("string", "callId", "$dlg_var(seat_cdr_id)", "$var(recording_json)");
    jansson_set("integer", "revision", "$var(recording_revision)", "$var(recording_json)");
    if ($var(recording_rtp_ok) == 1) { jansson_set("true", "success", "", "$var(recording_json)"); }
    else { jansson_set("false", "success", "", "$var(recording_json)"); }
    $var(recording_headers) = "Content-Type: application/json\r\nAuthorization: Bearer " + $env(SEAT_CONTROL_TOKEN);
    $var(recording_response) = "";
    $var(recording_status) = http_client_query("http://127.0.0.1:8882/v1/call-events/media/complete", "$var(recording_json)", "$var(recording_headers)", "$var(recording_response)");
    $var(recording_headers) = $null;
    if ($var(recording_status) != 200) { $dlg_var(recording_media_unsafe) = "1"; }
}

route[RECORDING_MEDIA_CLOSE] {
    if ($env(SEAT_RECORDING_ENABLED) != "1" || $dlg_var(seat_cdr_id) == $null) { return; }
    $var(recording_json) = "{}";
    jansson_set("string", "callId", "$dlg_var(seat_cdr_id)", "$var(recording_json)");
    jansson_set("integer", "count", "$(dlg_var(recording_media_revision){s.int})", "$var(recording_json)");
    if ($dlg_var(recording_media_unsafe) == "1") { jansson_set("true", "unsafe", "", "$var(recording_json)"); }
    else { jansson_set("false", "unsafe", "", "$var(recording_json)"); }
    $var(recording_headers) = "Content-Type: application/json\r\nAuthorization: Bearer " + $env(SEAT_CONTROL_TOKEN);
    $var(recording_response) = "";
    $var(recording_status) = http_client_query("http://127.0.0.1:8882/v1/call-events/media/close", "$var(recording_json)", "$var(recording_headers)", "$var(recording_response)");
    $var(recording_headers) = $null;
    if ($var(recording_status) != 200) { $dlg_var(recording_media_unsafe) = "1"; }
}
