#!KAMAILIO

#!substdef "!GATEWAY_DOMAIN!localhost!g"
#!substdef "!SIP_PORT!5060!g"
#!substdef "!SIP_UPSTREAM_TRANSPORT!udp!g"
#!substdef "!WEBPHONE_ORIGIN_PATTERN!.*!g"
#!substdef "!WEBPHONE_ORIGIN!*!g"
#!substdef "!INTERNAL_WSS_PORT!8443!g"

#!trydefenv WITH_REVERSE_PROXY
#!trydefenv WITH_SIP_TLS

debug=2
log_stderror=yes
fork=no
children=8
auto_aliases=no
alias="GATEWAY_DOMAIN"

enable_tls=yes

#!ifdef WITH_REVERSE_PROXY
listen=tls:127.0.0.1:INTERNAL_WSS_PORT advertise GATEWAY_DOMAIN:443
#!else
listen=tls:0.0.0.0:443 advertise GATEWAY_DOMAIN:443
#!endif
listen=udp:0.0.0.0:5060 advertise GATEWAY_DOMAIN:5060
listen=tcp:0.0.0.0:5060 advertise GATEWAY_DOMAIN:5060
#!ifdef WITH_SIP_TLS
listen=tls:0.0.0.0:5061 advertise GATEWAY_DOMAIN:5061
#!endif

tcp_accept_no_cl=yes
tcp_connection_lifetime=3604
tcp_rd_buf_size=16384

loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "pv.so"
loadmodule "xlog.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xhttp.so"
loadmodule "websocket.so"
loadmodule "tls.so"
loadmodule "http_client.so"
loadmodule "nathelper.so"
loadmodule "path.so"
loadmodule "outbound.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "rtpengine.so"
loadmodule "dialog.so"

modparam("tls", "config", "/etc/kamailio/tls.cfg")

modparam("rr", "enable_double_rr", 2)

modparam("usrloc", "db_mode", 0)

modparam("registrar", "use_path", 0)
modparam("registrar", "lookup_filter_mode", 2)

modparam("nathelper", "received_avp", "$avp(RECEIVED)")
modparam("registrar", "received_avp", "$avp(RECEIVED)")

modparam("rtpengine", "rtpengine_sock", "udp:127.0.0.1:2223")

modparam("dialog", "db_mode", 0)
modparam("dialog", "hash_size", 4096)
modparam("dialog", "default_timeout", 43200)

modparam("http_client", "query_result", 0)
modparam("http_client", "query_maxdatasize", 4096)
modparam("http_client", "connection_timeout", 2)

modparam("websocket", "keepalive_mechanism", 1)
modparam("websocket", "keepalive_timeout", 30)
modparam("websocket", "cors_mode", 2)

request_route {
    route(REQINIT);

    if (nat_uac_test("64")) {
        force_rport();
        if (is_method("REGISTER")) {
            fix_nated_register();
        } else {
            if (!add_contact_alias()) {
                xlog("L_ERR", "Failed add_contact_alias for <$ct>\n");
                sl_send_reply("400", "Bad Request");
                exit;
            }
        }
    }

    if (has_totag()) {
        route(WITHINDLG);
        exit;
    }

    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            t_relay();
        }
        exit;
    }

    if (is_method("OPTIONS") && uri == myself) {
        sl_send_reply("200", "OK");
        exit;
    }

    t_check_trans();

    if (is_method("REGISTER")) {
        route(REGISTRAR);
        exit;
    }

    if (is_method("INVITE")) {
        route(INVITE);
        exit;
    }

    route(RELAY);
}

route[REGISTRAR] {
    # This gateway is a WS edge registrar; REGISTER must come from WebSocket UAs.
    # Reject non-WS REGISTER to prevent proxy loops and scanner abuse.
    if (!($proto =~ "ws")) {
        xlog("L_WARN", "Rejecting non-WS REGISTER from $si:$sp proto=$proto for <$tu>\n");
        sl_send_reply("403", "REGISTER via WebSocket required");
        exit;
    }

    $avp(orig_contact) = $ct;

    if (!save("location", "0x02")) {
        sl_reply_error();
        exit;
    }

    remove_hf("Contact");
    if ($env(DOMAIN) != $null && $env(DOMAIN) != "") {
        append_hf("Contact: <sip:$fU@$env(DOMAIN):SIP_PORT;transport=SIP_UPSTREAM_TRANSPORT>\r\n");
    } else {
        append_hf("Contact: <sip:$fU@GATEWAY_DOMAIN:SIP_PORT;transport=SIP_UPSTREAM_TRANSPORT>\r\n");
    }

    add_path_received();
    append_hf("Supported: path\r\n");

    route(SET_UPSTREAM_DU);

    t_on_reply("REGISTER_REPLY");
    t_on_failure("REGISTER_FAIL");

    route(RELAY);
}

onreply_route[REGISTER_REPLY] {
    if (nat_uac_test("64")) {
        add_contact_alias();
    }

    if ($rs == "200" && $avp(orig_contact) != $null) {
        remove_hf("Contact");
        append_hf("Contact: $avp(orig_contact)\r\n");
    }
}

failure_route[REGISTER_FAIL] {
    if (t_is_canceled()) {
        exit;
    }

    if (t_check_status("403|404|488|5[0-9][0-9]")) {
        xlog("L_WARN", "REGISTER hard failure, unregistering <$tu>\n");
        unregister("location", "$tu");
    }
}

route[INVITE] {
    record_route();

    if (!has_totag()) {
        dlg_manage();
    }

    if ($proto =~ "ws") {
        route(SET_UPSTREAM_DU);
    } else {
        if (!lookup("location")) {
            sl_send_reply("404", "Not Found");
            exit;
        }
    }

    if (has_body("application/sdp")) {
        route(NATMANAGE);
    }

    t_on_reply("INVITE_REPLY");
    route(RELAY);
}

onreply_route[INVITE_REPLY] {
    if (nat_uac_test("64")) {
        add_contact_alias();
    }

    if (t_check_status("(180)|(183)|(200)") && has_body("application/sdp")) {
        route(NATMANAGE);
    }
}

route[SET_UPSTREAM_DU] {
    if ($env(ROUTING_MODE) == "single-provider") {
        if ($env(SIP_PROVIDER_URI) != $null
                && $env(SIP_PROVIDER_URI) != ""
                && ($env(SIP_PROVIDER_URI) =~ "^sip:[^ ]+$")) {
            $du = $env(SIP_PROVIDER_URI);
            return;
        }

        xlog("L_ERR", "ROUTING_MODE=single-provider but SIP_PROVIDER_URI is missing/invalid.\n");
        sl_send_reply("500", "Gateway Configuration Error");
        exit;
    }
}

route[WITHINDLG] {
    $var(orig_ru) = $ru;
    $var(orig_has_alias) = 0;
    if ($var(orig_ru) =~ ";alias=") {
        $var(orig_has_alias) = 1;
    }

    # Deterministic SIP->WS in-dialog handling: if upstream targets a WS alias
    # in Request-URI, decode and relay directly before loose_route() mutates $ru.
    # Skip ACK here (handled separately below).
    if (!is_method("ACK") && !($proto =~ "ws") && $var(orig_has_alias) == 1) {
        $ru = $var(orig_ru);
        if (handle_ruri_alias()) {
            xlog("L_INFO", "In-dialog direct alias relay method=$rm ru=<$ru>\n");
            if (is_method("INVITE|UPDATE")) {
                if (has_body("application/sdp")) {
                    route(NATMANAGE);
                }
                t_on_reply("INVITE_REPLY");
            }
            route(RELAY);
            exit;
        }
        xlog("L_WARN", "In-dialog direct alias decode failed method=$rm ru=<$ru>; falling back to route-set logic\n");
    }

    if (loose_route()) {
        # Always prefer the original alias-bearing R-URI for WS routing.
        # Some peers send route-sets where loose_route() rewrites $ru and hides alias.
        if ($var(orig_has_alias) == 1) {
            $ru = $var(orig_ru);
            if (!handle_ruri_alias()) {
                xlog("L_ERR", "Bad alias in R-URI <$ru>\n");
                sl_send_reply("400", "Bad Request");
                exit;
            }
        } else if ($du == "") {
            xlog("L_WARN", "In-dialog request without route-set and no alias: rm=$rm ru=$ru from=$si:$sp\n");
        }

        if (is_method("INVITE|UPDATE")) {
            if (has_body("application/sdp")) {
                route(NATMANAGE);
            }
            t_on_reply("INVITE_REPLY");
        }

        route(RELAY);
    } else {
        if (is_method("ACK")) {
            # For non-2xx ACKs, relay using tm transaction state if available.
            if (t_check_trans()) {
                route(RELAY);
                exit;
            }

            # For 2xx ACKs, some B2BUAs/providers send broken or missing route-sets.
            # Use the same alias/usrloc fallback strategy as other in-dialog requests.
            if (!($proto =~ "ws")) {
                if ($var(orig_has_alias) == 1) {
                    $ru = $var(orig_ru);
                    if (!handle_ruri_alias()) {
                        xlog("L_ERR", "In-dialog ACK fallback alias decode failed ru=<$ru>\n");
                    } else {
                        xlog("L_INFO", "In-dialog ACK fallback forwarded via alias ru=<$ru>\n");
                        route(RELAY);
                        exit;
                    }
                }

                if (uri == myself && lookup("location")) {
                    xlog("L_INFO", "In-dialog ACK fallback forwarded via usrloc ru=<$ru>\n");
                    route(RELAY);
                    exit;
                }

                xlog("L_WARN", "In-dialog ACK fallback failed ru=<$ru> from $si:$sp\n");
            }
            exit;
        }

        # Provider/B2BUA compatibility: some systems send in-dialog requests
        # without proper Route headers. Try alias and usrloc fallback before 404.
        if (!($proto =~ "ws")) {
            if ($var(orig_has_alias) == 1) {
                $ru = $var(orig_ru);
                if (!handle_ruri_alias()) {
                    xlog("L_ERR", "In-dialog fallback alias decode failed method=$rm ru=<$ru>\n");
                } else {
                    xlog("L_INFO", "In-dialog fallback forwarded via alias method=$rm ru=<$ru>\n");
                    if (is_method("INVITE|UPDATE")) {
                        if (has_body("application/sdp")) {
                            route(NATMANAGE);
                        }
                        t_on_reply("INVITE_REPLY");
                    }
                    route(RELAY);
                    exit;
                }
            }

            # usrloc fallback is valid only for local domains.
            if (uri == myself && lookup("location")) {
                xlog("L_INFO", "In-dialog fallback forwarded via usrloc method=$rm ru=<$ru>\n");
                if (is_method("INVITE|UPDATE")) {
                    if (has_body("application/sdp")) {
                        route(NATMANAGE);
                    }
                    t_on_reply("INVITE_REPLY");
                }
                route(RELAY);
                exit;
            }

            xlog("L_WARN", "In-dialog fallback failed method=$rm ru=<$ru> from $si:$sp\n");
        }
        sl_send_reply("404", "Not Found");
    }

    exit;
}

route[NATMANAGE] {
    if (!has_body("application/sdp")) {
        return;
    }

    if ($proto =~ "ws") {
        $var(rtpdir) = "ws->sip";
        $var(rtpflags) = "replace-origin replace-session-connection ICE=remove rtcp-mux-demux DTLS=off SDES-off RTP/AVP";
    } else {
        $var(rtpdir) = "sip->ws";
        $var(rtpflags) = "replace-origin replace-session-connection ICE=force DTLS=passive SDES-off rtcp-mux-offer RTP/SAVPF";
    }

    xlog("L_INFO", "NATMANAGE SDP direction=$var(rtpdir) proto=$proto\n");
    rtpengine_manage("$var(rtpflags)");
}

route[RELAY] {
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

route[REQINIT] {
    $var(allowed_domains) = $env(ALLOWED_SIP_DOMAINS);

    if (!mf_process_maxfwd_header("16")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    if (!has_totag() && $proto =~ "ws" && is_method("REGISTER|INVITE")) {
        if ($var(allowed_domains) != $null && $var(allowed_domains) != "") {
            $var(allow_pattern) = "(^|,)[ ]*" + $rd + "[ ]*(,|$)";
            if (!($var(allowed_domains) =~ $var(allow_pattern))) {
                xlog("L_WARN", "Blocked request for non-allowlisted domain <$rd>\n");
                sl_send_reply("403", "Domain Not Allowed");
                exit;
            }
        }
    }
}

event_route[xhttp:request] {
    set_reply_close();
    set_reply_no_connect();

    if ($hdr(Upgrade) =~ "websocket"
            && $hdr(Connection) =~ "Upgrade"
            && $rm == "GET") {
        $var(h) = $hdr(Host);
        if ($var(h) != $null && $var(h) =~ ":") {
            $var(h) = $(var(h){s.select,0,:});
        }
        $var(ws_host_expected) = $env(DOMAIN);
        if ($var(ws_host_expected) == $null || $var(ws_host_expected) == "") {
            $var(ws_host_expected) = "GATEWAY_DOMAIN";
        }
        xlog("L_INFO", "WS handshake attempt: host='$hdr(Host)' norm='$var(h)' uri='$hu' from $si:$sp\n");

        if ($var(h) == $null || $var(h) != $var(ws_host_expected)) {
            xhttp_reply("403", "Forbidden", "", "");
            exit;
        }

        if (ws_handle_handshake()) {
            exit;
        }
        xhttp_reply("500", "Server Error", "text/plain", "WebSocket handshake failed");
        exit;
    }

    if ($hu =~ "^/turn-credentials([?]|$)") {
        $var(turn_api_token) = $env(TURN_API_TOKEN);

        if ($rm == "OPTIONS") {
            append_to_reply("Access-Control-Allow-Origin: WEBPHONE_ORIGIN\r\n");
            append_to_reply("Access-Control-Allow-Methods: GET, OPTIONS\r\n");
            append_to_reply("Access-Control-Allow-Headers: Authorization\r\n");
            append_to_reply("Access-Control-Max-Age: 86400\r\n");
            append_to_reply("Vary: Origin\r\n");
            xhttp_reply("200", "OK", "text/plain", "ok");
            exit;
        }

        if ($rm != "GET") {
            append_to_reply("Allow: GET, OPTIONS\r\n");
            xhttp_reply("405", "Method Not Allowed", "text/plain", "Method not allowed");
            exit;
        }

        if ($hdr(Origin) != $null) {
            if ("WEBPHONE_ORIGIN" != "*" && $hdr(Origin) != "WEBPHONE_ORIGIN") {
                xhttp_reply("403", "Forbidden", "text/plain", "Origin not allowed");
                exit;
            }
        }

        if ($var(turn_api_token) != "") {
            $var(auth_expected) = "Bearer " + $var(turn_api_token);
            if ($hdr(Authorization) != $var(auth_expected)) {
                xhttp_reply("401", "Unauthorized", "text/plain", "Missing or invalid token");
                exit;
            }
        }

        http_client_query("http://127.0.0.1:8880/turn-credentials", "$var(turn_json)");
        $var(turn_http_status) = $rc;
        # http_client_query returns an HTTP status, including positive 4xx.
        # Testing its truthiness incorrectly turns a disabled helper into 200.
        if ($var(turn_http_status) == 404) {
            xhttp_reply("404", "Not Found", "text/plain", "TURN is disabled");
            exit;
        }
        if ($var(turn_http_status) != 200) {
            xhttp_reply("502", "Bad Gateway", "text/plain", "TURN credential helper unavailable");
            exit;
        }

        append_to_reply("Access-Control-Allow-Origin: WEBPHONE_ORIGIN\r\n");
        append_to_reply("Vary: Origin\r\n");
        append_to_reply("Cache-Control: private, no-store\r\n");
        append_to_reply("Pragma: no-cache\r\n");
        xhttp_reply("200", "OK", "application/json", "$var(turn_json)");
        exit;
    }

    xhttp_reply("404", "Not Found", "text/plain", "not found");
}

event_route[websocket:closed] {
    xlog("L_INFO", "WebSocket closed from $si:$sp\n");
}
