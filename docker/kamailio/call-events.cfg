# Enabled only for managed seats with a durable private local journal.
# http_client_query uses the existing bounded timeout (2 seconds); no remote
# backend request is made from a SIP worker and legacy HTTP settings are intact.
loadmodule "jansson.so"
loadmodule "tmx.so"
include_file "/opt/bitcall/recording-media.cfg"

route[SEAT_CDR_ADMIT] {
    $var(cdr_json) = "{}";
    jansson_set("string", "tenantId", "$dlg_var(seat_tenant)", "$var(cdr_json)");
    jansson_set("string", "seatId", "$dlg_var(seat_id)", "$var(cdr_json)");
    jansson_set("integer", "snapshotRevision", "$var(seat_generation)", "$var(cdr_json)");
    jansson_set("string", "sipCallId", "$ci", "$var(cdr_json)");
    jansson_set("string", "fromTag", "$ft", "$var(cdr_json)");
    jansson_set("string", "legId", "", "$var(cdr_json)");
    jansson_set("string", "destination", "$rU", "$var(cdr_json)");
    if ($avp(seat_requested_caller_id) == $null) {
        jansson_set("null", "requestedCallerId", "", "$var(cdr_json)");
    } else {
        jansson_set("string", "requestedCallerId", "$avp(seat_requested_caller_id)", "$var(cdr_json)");
    }
    jansson_set("string", "effectiveCallerId", "$var(cdr_effective_caller_id)", "$var(cdr_json)");
    $var(cdr_headers) = "Content-Type: application/json\r\nAuthorization: Bearer " + $env(SEAT_CONTROL_TOKEN);
    $var(cdr_response) = "";
    $var(cdr_status) = http_client_query("http://127.0.0.1:8882/v1/call-events/admit",
        "$var(cdr_json)", "$var(cdr_headers)", "$var(cdr_response)");
    $var(cdr_headers) = $null;
    $var(cdr_id) = "";
    if ($var(cdr_status) != 200
            || !jansson_get("callId", "$var(cdr_response)", "$var(cdr_id)")
            || !($var(cdr_id) =~ "^[a-f0-9]{32}$")) {
        $sht(seat_calls=>$dlg_var(seat_call_key)) = $null;
        xlog("L_ERR", "seat-cdr: durable call admission unavailable\n");
        sl_send_reply("503", "Call Journal Unavailable");
        exit;
    }
    $dlg_var(seat_cdr_id) = $var(cdr_id);
    $dlg_var(recording_media_revision) = "0";
    $dlg_var(recording_media_unsafe) = "0";
}

# Callers set all four request-local event fields: type, SIP code (0 means unknown), reason and
# termination side (empty means unknown). JSON encoding handles SIP tag escaping.
route[SEAT_CDR_APPEND] {
    if ($dlg_var(seat_cdr_id) == $null) { return; }
    if ($var(cdr_type) == "ended" || $var(cdr_type) == "uncertain") { route(RECORDING_MEDIA_CLOSE); }
    $var(cdr_json) = "{}";
    jansson_set("string", "callId", "$dlg_var(seat_cdr_id)", "$var(cdr_json)");
    jansson_set("string", "type", "$var(cdr_type)", "$var(cdr_json)");
    $var(cdr_leg) = "";
    if ($tt != $null) { $var(cdr_leg) = $tt; }
    if (is_method("BYE") && !($proto =~ "ws") && $ft != $null) { $var(cdr_leg) = $ft; }
    jansson_set("string", "legId", "$var(cdr_leg)", "$var(cdr_json)");
    if ($var(cdr_code) == 0) {
        jansson_set("null", "sipCode", "", "$var(cdr_json)");
    } else {
        jansson_set("integer", "sipCode", "$var(cdr_code)", "$var(cdr_json)");
    }
    if ($var(cdr_reason) == "") {
        jansson_set("null", "reason", "", "$var(cdr_json)");
    } else {
        jansson_set("string", "reason", "$var(cdr_reason)", "$var(cdr_json)");
    }
    if ($var(cdr_side) == "") {
        jansson_set("null", "endedBy", "", "$var(cdr_json)");
    } else {
        jansson_set("string", "endedBy", "$var(cdr_side)", "$var(cdr_json)");
    }
    $var(cdr_headers) = "Content-Type: application/json\r\nAuthorization: Bearer " + $env(SEAT_CONTROL_TOKEN);
    $var(cdr_response) = "";
    $var(cdr_status) = http_client_query("http://127.0.0.1:8882/v1/call-events/append",
        "$var(cdr_json)", "$var(cdr_headers)", "$var(cdr_response)");
    $var(cdr_headers) = $null;
    if ($var(cdr_status) != 200) {
        # Failure is observable; never terminate an established call to save CDR.
        xlog("L_ERR", "seat-cdr: lifecycle observation could not be journaled\n");
    }
}

route[SEAT_CDR_FAILURE] {
    if ($avp(seat_initial_invite) != 1) { return; }
    if (t_is_canceled()) {
        $var(cdr_type) = "failed"; $var(cdr_code) = 487; $var(cdr_reason) = "cancelled"; $var(cdr_side) = "agent"; route(SEAT_CDR_APPEND);
    } else if (t_check_status("486|600")) {
        $var(cdr_type) = "failed"; $var(cdr_code) = $T_reply_code; $var(cdr_reason) = "busy"; $var(cdr_side) = "upstream"; route(SEAT_CDR_APPEND);
    } else if (t_check_status("403|603")) {
        $var(cdr_type) = "failed"; $var(cdr_code) = $T_reply_code; $var(cdr_reason) = "rejected"; $var(cdr_side) = "upstream"; route(SEAT_CDR_APPEND);
    } else if (t_check_status("408|504")) {
        $var(cdr_type) = "failed"; $var(cdr_code) = $T_reply_code; $var(cdr_reason) = "timeout"; $var(cdr_side) = "gateway"; route(SEAT_CDR_APPEND);
    } else if (t_check_status("480")) {
        $var(cdr_type) = "failed"; $var(cdr_code) = $T_reply_code; $var(cdr_reason) = "no_answer"; $var(cdr_side) = "upstream"; route(SEAT_CDR_APPEND);
    } else {
        $var(cdr_type) = "failed"; $var(cdr_code) = $T_reply_code; $var(cdr_reason) = "upstream_failure"; $var(cdr_side) = "upstream"; route(SEAT_CDR_APPEND);
    }
}
